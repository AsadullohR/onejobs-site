<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mailru-domain" content="m8p7vRujWWr1vVcc" />
    <meta name="theme-color" content="#0d1b3e" />
    <title>OneJobs Consulting — International Employment Agency</title>
    <meta
      name="description"
      content="OneJobs Consulting connects jobseekers, employers, and partner agencies with verified international jobs in Germany, Korea, Croatia, Poland, Japan, and the UAE. Visa, documents, and travel handled end to end."
    />
    <meta property="og:title" content="OneJobs Consulting — We Open Doors to Your Future" />
    <meta property="og:description" content="International employment opportunities, work permits, visa services, and travel support." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Static copies of every React form so Netlify Forms detects them at deploy time.
         Keep field names in sync with src/pages/*.jsx. -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input name="name" /><input name="contact" /><textarea name="message"></textarea>
      <input name="email" /><input name="company" />
    </form>
    <form name="job-order" netlify netlify-honeypot="bot-field" hidden>
      <input name="company" /><input name="contact" /><input name="email" />
      <input name="industry" /><input name="roles" /><input name="deadline" />
      <textarea name="details"></textarea>
    </form>
    <form name="jobseeker-application" netlify netlify-honeypot="bot-field" hidden>
      <input name="name" /><input name="contact" /><input name="country" /><textarea name="skills"></textarea>
    </form>
    <form name="agency-partnership" netlify netlify-honeypot="bot-field" hidden>
      <input name="agency" /><input name="contact_person" /><input name="contact" />
      <input name="country" /><input name="model" /><textarea name="details"></textarea>
    </form>
  </body>
</html>
